name: Build, Test, and Publish NuGet Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-test-pack-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Trusted publishing: lets NuGet/login request an OIDC token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack NuGet packages
        run: dotnet pack --configuration Release --no-build --output nupkgs

      # Trusted publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key.
      # Requires a trusted publishing policy for this repository and workflow on nuget.org.
      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Only a new version is published. Pushing an existing version is skipped.
      - name: Publish to NuGet.org
        run: |
          for package in nupkgs/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
              --skip-duplicate
          done